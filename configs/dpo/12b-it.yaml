output_dir: experiments/dpo/12b-it
sft_dir: experiments/sft/12b-it       # model, assistant prompt and decoding come from this run
seed: 42

candidates:                 # sampled from the SFT adapter on the training split
  count: 4
  temperature: 0.7
  top_p: 0.9

judge:                      # scores and compares candidates to build chosen/rejected pairs
  model: qwen3.5:122b
  url: http://127.0.0.1:11434/api/chat
  rubric_prompts: prompts/judge/rubrics
  pairwise_prompt: prompts/judge/pairwise.md
  context_token_cap: 6000
  parallel: 6
  save_every: 20
  options:
    temperature: 0.1
    top_p: 0.8
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    seed: 42
    num_predict: 1200

reference: sft              # frozen SFT adapter as the DPO reference; "base" disables the adapter instead
rpo_alpha: 1.0              # weight of the chosen-answer NLL added to the DPO loss; 0 disables it
validation_fraction: 0.1    # pairs held out to monitor the DPO loss
split_seed: 42

training:                   # trl.DPOConfig
  learning_rate: 0.00005
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  beta: 0.2
  max_length: 2048
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  optim: adamw_torch_fused
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  max_grad_norm: 0.3
  eval_strategy: steps
  eval_steps: 20
  save_strategy: steps
  save_steps: 20
  save_total_limit: null
  load_best_model_at_end: false
  logging_steps: 10
  report_to: wandb
  run_name: dpo-12b-it
