output_dir: experiments/base/27b
system_prompt: prompts/assistant/baseline.md
seed: 42

model:                      # served by a local Ollama; the HF tokenizer renders the chat template
  backend: ollama
  weights: gemma3:27b-it-qat
  tokenizer: google/gemma-3-27b-it

generation:                 # answers on the validation split
  max_input_length: 2048
  max_new_tokens: 100
  temperature: 0.3
  top_p: 1.0
  do_sample: true
