output_dir: experiments/sft/12b-pt
system_prompt: prompts/assistant/baseline.md
seed: 42

model:
  weights: google/gemma-3-12b-pt
  tokenizer: google/gemma-3-12b-it
  quantization: 4bit

lora:                       # peft.LoraConfig
  r: 16
  lora_alpha: 16
  lora_dropout: 0.05

training:                   # trl.SFTConfig
  learning_rate: 0.0002
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_length: 2048
  packing: false
  bf16: true
  gradient_checkpointing: true
  optim: adamw_torch_fused
  lr_scheduler_type: constant
  warmup_steps: 0
  max_grad_norm: 0.3
  eval_on_start: true
  eval_strategy: steps
  eval_steps: 10
  save_strategy: steps
  save_steps: 10
  save_total_limit: 1
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  logging_steps: 10
  report_to: wandb
  run_name: sft-12b-pt

generation:                 # answers on the validation split
  max_input_length: 2048
  max_new_tokens: 100
  temperature: 0.3
  top_p: 1.0
  do_sample: true
